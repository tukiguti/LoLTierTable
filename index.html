<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover はノッチ端末で env(safe-area-inset-*) を機能させるために必要 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LoLTierTable — チャンピオンのティア表とマトリクス図を作る</title>
    <meta
      name="description"
      content="League of Legends のチャンピオンでティア表とマトリクス図を作れる無料のWebツール。ドラッグして並べて、PNG画像として保存できます。"
    />

    <!-- XやDiscordにURLを貼ったときのプレビュー。og:image は絶対URLでないと読まれない -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LoLTierTable" />
    <meta property="og:title" content="LoLTierTable — チャンピオンのティア表とマトリクス図を作る" />
    <meta
      property="og:description"
      content="ドラッグして並べるだけ。作った図はPNG画像で保存でき、URLでそのまま共有できます。"
    />
    <meta property="og:url" content="https://loltiertable.tukiguti.com/" />
    <meta property="og:image" content="https://loltiertable.tukiguti.com/ogp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
